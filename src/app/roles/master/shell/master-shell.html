<div class="master-shell">
  <button
    type="button"
    class="velo"
    [class.is-visible]="menuMovil()"
    (click)="cerrarTodo()"
    aria-label="Cerrar menú de navegación"
  ></button>

  <aside
    id="barra-master"
    class="barra"
    [class.is-expandida]="expandido()"
    (mouseenter)="abrirHover()"
    (mouseleave)="cerrarHover()"
    (focusin)="abrirHover()"
    (focusout)="cerrarEnfoque($event)"
  >
    <div class="barra__cabecera">
      <a
        class="marca"
        routerLink="/master"
        (click)="alNavegar()"
        aria-label="Ir al panel del master"
      >
        <span class="marca__logo" aria-hidden="true">V</span>
        <span class="barra__marca-texto">
          <strong>Sistema V</strong>
          <small>Master</small>
        </span>
      </a>

      <button
        type="button"
        class="barra__pin"
        (click)="alternarFijado()"
        [attr.aria-pressed]="fijado()"
        [attr.aria-label]="fijado() ? 'Soltar menú' : 'Fijar menú'"
        [attr.title]="fijado() ? 'Soltar menú' : 'Fijar menú'"
      >
        <ca-icon [name]="fijado() ? 'chevron-left' : 'chevron-right'" aria-hidden="true"></ca-icon>
      </button>

      <button type="button" class="barra__cerrar" (click)="cerrarMenu()" aria-label="Cerrar menú">
        <ca-icon name="close" aria-hidden="true"></ca-icon>
      </button>
    </div>

    <nav class="barra__nav" aria-label="Navegación del master">
      @for (item of navegacion; track item.ruta) {
        <a
          class="barra__item"
          [routerLink]="item.ruta"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="item.exacto ? { exact: true } : { exact: false }"
          [attr.title]="item.etiqueta"
          (click)="alNavegar()"
        >
          <span class="barra__icono" aria-hidden="true">
            <ca-icon [name]="item.icono" [class]="'ui-icon ui-icon--' + item.icono"></ca-icon>
          </span>
          <span class="barra__etiqueta">{{ item.etiqueta }}</span>
        </a>
      }
    </nav>

    <div class="barra__pie">
      <div class="barra__sesion">
        <span class="barra__avatar" aria-hidden="true">{{ iniciales() }}</span>
        <span class="barra__sesion-texto">
          <strong>{{ nombre() }}</strong>
          <small>Master</small>
        </span>
      </div>

      <button type="button" class="barra__salir" (click)="cerrarSesion()">
        <ca-icon name="log-out" aria-hidden="true"></ca-icon>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <div class="master-contenido">
    <header class="barra-superior">
      <button
        type="button"
        class="barra-superior__menu"
        (click)="abrirMenu()"
        [attr.aria-expanded]="menuMovil()"
        aria-controls="barra-master"
        aria-label="Abrir menú de navegación"
      >
        <ca-icon name="layouts" class="ui-icon ui-icon--layouts" aria-hidden="true"></ca-icon>
      </button>

      <div class="barra-superior__ruta">
        <span class="barra-superior__rol">Master</span>
        <span aria-hidden="true">/</span>
        <span>Control nacional</span>
      </div>

      <div class="barra-superior__cuenta">
        <div class="master-cuenta">
          <span class="master-cuenta__avatar" aria-hidden="true">{{ iniciales() }}</span>
          <span class="master-cuenta__texto">
            <strong>{{ nombre() }}</strong>
            <span>Autoridad nacional</span>
          </span>
        </div>
      </div>
    </header>

    <main class="master-area">
      <router-outlet />
    </main>
  </div>
</div>
